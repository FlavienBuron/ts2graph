# @package dataset
name: airq

dataset_path: ./datasets/data/air_quality/
small: false
variant: full
freq: 60min
masked_sensors: []
scaling_type: std
in_sample: true
window: 24

missingness:
  enabled: false
  pattern: mcar_blocks
  block_size: 10
  target_rate: ???
  cumulative: true
  eval_mask_mode: fixed
  cache_dir: ./datasets/missingness_scenarios/cache/${dataset.name}_${dataset.variant}
  force_generate: false
  seed: ${seed}

# @package dataset
name: airq

dataset_path: ./datasets/data/air_quality/
small: false
variant: full
freq: 60min
masked_sensors: []
scaling_type: std
in_sample: true
window: 24

missingness:
  enabled: false
  pattern: mcar_blocks
  block_size: 10
  target_rate: ???
  sensor_coverage_levels: ???
  eval_fraction: 0.047
  cumulative: true
  eval_mask_mode: fixed
  cache_dir: ./datasets/missingness_scenarios/cache/${dataset.name}_${dataset.variant}
  force_generate: false
  seed: ${seed}
  first_rate: 0.3
  suffix: ${cond:${eq:${dataset.missingness.pattern}, aligned_block}, cov${dataset.missingness.sensor_coverage_levels.0}, rate${dataset.missingness.target_rate}}

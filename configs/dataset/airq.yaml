# @package dataset
name: airq

dataset_path: ./datasets/data/air_quality/
small: false
variant: full
freq: 60min
masked_sensors: []
scaling_type: std
in_sample: true
window: 24

missingness:
  enabled: false
  pattern: mcar_blocks
  block_size: 10
  target_rates: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
  sensor_coverage_levels: [0.10, 0.20, 0.30]
  eval_fraction: 0.047
  cumulative: true
  eval_mask_mode: fixed
  cache_dir: ./datasets/missingness_scenarios/cache/${dataset.name}_${dataset.variant}
  force_generate: false
  seed: ${seed}
  first_rate: 0.3

  suffix: ${cond:${eq:${dataset.missingness.pattern}, aligned_blocks}, cov${dataset.missingness.sensor_coverage_levels.0}, rate${dataset.missingness.target_rate}}
